services:
  - type: web
    name: classtrack
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_TTL_SECONDS
        value: 43200
      - key: APP_ORIGIN
        value: '*'
